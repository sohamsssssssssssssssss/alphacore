name: AlphaCore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: alphacore_test
          POSTGRES_USER: soham
          POSTGRES_PASSWORD: alphacore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx hypothesis

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://soham:alphacore@localhost:5432/alphacore_test
        run: |
          cd backend
          pytest tests/ sandbox/tests/ ../scripts/tests/ -v --tb=short -m "not benchmark"

      - name: Check imports
        env:
          DATABASE_URL: postgresql+asyncpg://soham:alphacore@localhost:5432/alphacore_test
        run: |
          cd backend
          python -c "import main; print('Backend imports OK')"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pybind11
        run: python -m pip install pybind11==3.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build C++ (Release)
        run: |
          cd engine
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc) --target gateway_test
          cmake --build build -j$(nproc) --target engine_test
          cmake --build build -j$(nproc) --target replication_test
          cmake --build build -j$(nproc) --target fault_test
          cmake --build build -j$(nproc) --target ha_chaos_test
          cmake --build build -j$(nproc) --target deterministic_replay_test
          cmake --build build -j$(nproc) --target split_brain_counterexample
          cmake --build build -j$(nproc) --target fencing_test
          cmake --build build -j$(nproc) --target add_bench

      - name: Build C++ (TSan)
        run: |
          cd engine
          cmake -B build_tsan -DALPHACORE_TSAN=ON
          cmake --build build_tsan -j$(nproc) --target mpsc_tsan_test
          cmake --build build_tsan -j$(nproc) --target fencing_tsan_test

      - name: Run unit tests
        run: |
          cd engine/build
          ./gateway_test
          ./engine_test
          ./replication_test
          ./split_brain_counterexample
          ./fencing_test
          OB_FAULT_POOL_EXHAUSTION=1 OB_FAULT_QUEUE_FULL=1 ./fault_test

      - name: Run HA chaos tests
        run: |
          cd engine/build
          ./ha_chaos_test

      - name: Run deterministic replay test
        run: |
          cd engine/build
          ./deterministic_replay_test

      - name: Run TSan tests
        run: |
          cd engine/build_tsan
          ./mpsc_tsan_test
          ./fencing_tsan_test

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run TLA+ model checks
        shell: bash  # enables pipefail so a TLC failure is not masked by tail
        run: |
          curl -sfL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          cd specs/tla
          timeout 600 java -Xmx8g -cp /tmp/tla2tools.jar tlc2.TLC MpscQueue.tla -config MpscQueue.cfg -deadlock 2>&1 | tail -10
          timeout 600 java -Xmx8g -cp /tmp/tla2tools.jar tlc2.TLC PrimaryBackup.tla -config PrimaryBackup.cfg -deadlock 2>&1 | tail -10


      - name: Run bounded engine TLA+ models (each measured under 5 min)
        shell: bash
        run: |
          cd specs/tla_engine_models
          timeout 300 java -Xmx2g -cp /tmp/tla2tools.jar tlc2.TLC MpscQueue.tla -config ModelMpsc_tiny.cfg -deadlock
          timeout 300 java -Xmx2g -cp /tmp/tla2tools.jar tlc2.TLC MatchingEngine.tla -config ModelMatching_small2.cfg -deadlock
          timeout 300 java -Xmx2g -cp /tmp/tla2tools.jar tlc2.TLC OrderBook.tla -config ModelOrderBook_small3.cfg -deadlock

      # Fenced replication model (specs/REPLICATION_FINDING.md); ~65.6M distinct states.
      - name: Run fenced PrimaryBackup engine model
        shell: bash
        run: |
          cd specs/tla_engine_models
          timeout 2400 java -Xmx10g -cp /tmp/tla2tools.jar tlc2.TLC PrimaryBackup.tla -config ModelPrimaryBackup.cfg -deadlock -workers auto

  report-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: python -m pip install -r report/requirements.txt

      # Generates report/generated/ and report/figures/ from tracked files and runs
      # scripts/report/check_report.py; no TeX engine is needed.
      - name: Build report assets and check consistency
        run: python scripts/report/build_assets.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: report-assets
          path: |
            report/generated/
            report/figures/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build status
        run: echo "Frontend build passed"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t alphacore-backend

      - name: Build frontend image
        run: docker build ./frontend -t alphacore-frontend

      - name: Docker build status
        run: echo "All Docker images built successfully"
